<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Cloud-Based Expense Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%200%22%20100%22%20100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span>☁️ ExpenseTracker</span>
      <span class="aws-badge">AWS Cloud Lab</span>
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/login.html">Login</a></li>
    </ul>
  </nav>

  <!-- Register Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p>Register as a new user in the Amazon RDS MySQL database</p>
      </div>

      <form id="form-register">
        <div class="form-group" style="margin-bottom: 1.15rem;">
          <label for="name">Full Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-control" 
            placeholder="John Doe" 
            required 
            autocomplete="name"
          />
        </div>

        <div class="form-group" style="margin-bottom: 1.15rem;">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="student@cloudlab.edu" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group" style="margin-bottom: 1.15rem;">
          <label for="password">Password (Min. 6 chars)</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="confirm-password">Confirm Password</label>
          <input 
            type="password" 
            id="confirm-password" 
            name="confirmPassword" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="/login.html">Sign In</a>
      </div>
    </div>
  </div>

  <footer>
    <p>Cloud-Based Expense Tracker | B.Tech CSE Cloud Computing Lab Mini Project</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
