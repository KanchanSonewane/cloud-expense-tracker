<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Cloud-Based Expense Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%200%22%20100%22%20100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span>☁️ ExpenseTracker</span>
      <span class="aws-badge">AWS Cloud Lab</span>
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/register.html">Register</a></li>
    </ul>
  </nav>

  <!-- Login Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Sign In</h2>
        <p>Access your cloud-hosted expense manager</p>
      </div>

      <!-- Demo Account Quick Fill Helper -->
      <div class="demo-credentials-box" onclick="fillDemoCredentials()">
        <strong>⚡ Lab Viva Demo Account:</strong><br>
        Click here to autofill <code>demo@cloudlab.edu</code> / <code>Demo@1234</code>
      </div>

      <form id="form-login">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="student@cloudlab.edu" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Register here</a>
      </div>
    </div>
  </div>

  <footer>
    <p>Cloud-Based Expense Tracker | B.Tech CSE Cloud Computing Lab Mini Project</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
